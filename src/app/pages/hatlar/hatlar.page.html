<ion-header>
  <ion-toolbar>
    <ion-title>Hatlar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-container">
    <ion-searchbar
      placeholder="Hat kodu veya adı ara..."
      [(ngModel)]="arama"
      (ionInput)="filtrele()"
      debounce="250">
    </ion-searchbar>

    <div *ngIf="yukleniyor" class="durum">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Hatlar yükleniyor...</p>
    </div>

    <ion-text color="danger" *ngIf="hata">
      <p>{{ hata }}</p>
    </ion-text>

    <ion-list *ngIf="!yukleniyor && !hata">
      <ion-item *ngFor="let hat of filtreliHatlar">
        <ion-label>
          <h2>{{ hat.hatKodu }} · {{ hat.ad }}</h2>
          <p *ngIf="hat.aciklama">{{ hat.aciklama }}</p>
          <p>{{ hat.kaynak }} <span *ngIf="hat.tip">· Tip {{ hat.tip }}</span></p>
        </ion-label>
        <ion-button fill="clear" slot="end" (click)="favoriDegistir(hat)">
          <ion-icon [name]="favoriMi(hat) ? 'heart' : 'heart-outline'"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-list>

    <div class="bos" *ngIf="!yukleniyor && !hata && filtreliHatlar.length === 0">
      <h3>Hat bulunamadı</h3>
      <p>Arama kriterini değiştir veya veri kaynağını kontrol et.</p>
    </div>
  </div>
</ion-content>
