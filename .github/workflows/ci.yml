name: CI

on:
  push:
    branches: [main, master, release/publish-readiness]
  pull_request:
    branches: [main, master, release/publish-readiness]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Angular production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  api-build:
    name: ASP.NET Core build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore MarmaraUlasim.API/MarmaraUlasim.API.csproj
      - name: Build API
        run: dotnet build MarmaraUlasim.API/MarmaraUlasim.API.csproj --configuration Release --no-restore

  container-build:
    name: Production Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag marmara-ulasim:ci .
